[project]
name = "sds-common"
version = "2.0.0"
description = "A Python library for common functionality used to interact with SDS."
requires-python = "==3.13.*"
dependencies = [
    "google-auth>=2.38.0",
    "google-cloud-secret-manager>=2.26.0",
    "google-cloud-pubsub>=2.36.0",
    "google-cloud-storage>=3.9.0",
    "google-cloud-firestore>=2.21.0",
    "firebase-admin>=7.3.0",
    "requests>=2.32.3",
    "google-cloud-iam>=2.21.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.6.1",
    "pytest-order>=1.3.0",
]

lint = [
    "ruff>=0.11.7",
]

audit = [
    "pip-audit>=2.10.0",
]

publish = [
    "twine>=6.1.0",
    "keyring>=25.6.0",
    "keyrings-google-artifactregistry-auth>=1.1.2",
]

version-check = [
    "toml>=0.10.2",
    "tomlkit>=0.13.3",
]

[tool.ruff]
line-length = 121
exclude = [ "lib", "__pycache__", ".venv",]

[tool.ruff.lint]
extend-select = [ "E303", "W391", "W292", "E302"]
preview = true

